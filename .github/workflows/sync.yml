name: Sincronizar con Databricks

on:
  push:
    branches:
      - main

jobs:
  sync-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Actualizar Git Folder en Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        # Cambia la ruta por la que anotaste en el Paso 3
        run: |
          databricks repos update /Workspace/Users/jhon.liviasc@unmsm.edu.pe/databricks-test --branch main